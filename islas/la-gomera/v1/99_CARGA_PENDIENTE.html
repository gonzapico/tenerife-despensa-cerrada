function buildPrompt(){

  L.push('1. CONTEXTO QUE DEBES LEER PRIMERO (solo lectura; lee siempre el original citado)');

  R.leer.forEach(f=>L.push(`   - ${f}`));
  L.push('');
  L.push('2. DECISIONES YA TOMADAS (no las reabras; cítalas como tales)');
  R.decisiones.forEach(d=>L.push(`   - ${d}`));
  L.push('');
  L.push(`3. ESTADO AL CORTE ${D.corte} (${fmt(P.reduce((a,p)=>a+tot(p),0))} h pendientes, ${blocks} de ${nitems} pendientes bloquean la firma)`);
  P.forEach(p=>{
    L.push(`   · ${p.id} ${p.title} — ${p.stateTxt}. Siguiente paso: ${p.next}`);
    p.items.filter(i=>i.b).forEach(i=>L.push(`       bloquea: [${i.c}] ${i.t}`));
  });
  L.push('');
  L.push('4. OBJETIVO DE ESTA SESIÓN');
  L.push(`   ${R.objetivo}`);
  L.push('');
  L.push('5. IDEAS PARA ENRIQUECER MI CONOCIMIENTO A PARTIR DE LA INSTANTÁNEA (propón cuál hacemos primero y ejecútala si te lo confirmo)');
  R.ideas.forEach((x,k)=>{L.push(`   ${String.fromCharCode(97+k)}) ${x.titulo}. ${x.que}`);L.push(`      Por qué me ayuda a comprender: ${x.porque}`);if(x.skill)L.push(`      Se puede hacer con la skill ${x.skill}${x.alternativa?' (alternativa: '+x.alternativa+')':''}. Comprueba antes que está disponible.`);});
  L.push('');
  L.push('6. REGLAS');
  R.reglas.forEach(r=>L.push(`   - ${r}`));
  L.push('');
  L.push('');
  L.push('7. RESPUESTAS A LAS DECISIONES ABIERTAS (aplícalas; si alguna sigue en [RESPONDER], pregúntamela antes de tocar la pieza afectada)');
  answersText().split('\n').forEach(x=>L.push('   '+x));
  L.push('');
  L.push('Empieza confirmando en 5 líneas qué has leído y qué vas a hacer primero. No produzcas documentos hasta que confirme el objetivo.');
  return L.join('\n');
}

  else if(a.sel!==undefined && a.sel!==null && a.sel!=='') v = q.opciones[+a.sel];

  return v + (a.nota && a.nota.trim() ? ' — Nota: '+a.nota.trim() : '');

  if(e.target.id==='clrq'){ ANS={}; saveAns(); show(cur); return; }
  const g=e.target.closest('[data-go]'); if(g){show(+g.dataset.go);window.scrollTo(0,0);return;}
  const f=e.target.closest('[data-f]'); if(f){
    const v=f.dataset.f; f.parentElement.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b===f));
    stage.querySelectorAll('tbody tr[data-c]').forEach(r=>r.hidden=!(v==='*'||r.dataset.c===v)); return;}
  if(e.target.id==='copy'){
    const done=()=>document.getElementById('copied').textContent='Copiado';
    const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('ptxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('copied').textContent='Texto seleccionado: usa Ctrl+C';};
    try{navigator.clipboard.writeText(buildPrompt()).then(done,fb)}catch(err){fb()}
  }
});
document.getElementById('prev').onclick=()=>{show(cur-1);window.scrollTo(0,0)};
document.getElementById('next').onclick=()=>{show(cur+1);window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(cur);
</script>
