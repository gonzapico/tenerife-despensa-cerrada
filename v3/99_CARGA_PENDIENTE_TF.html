ego.", "Hay 19.216 ha de suelo agrícola abandonado y 2.382 ha de barbecho: el suelo no es lo que falta."], "quiz": ["¿Por qué en Tenerife sí importa cuánto plátano se come la isla, y en La Palma no?", "Porque hay once veces más bocas: 955.000 residentes piden 326 ha de platanera (el 8 % de la que hay), frente a las 29 ha de La Palma. Si el consumo se duplicara, la isla retendría 650 ha."], "next": "Decidir si el barbecho (2.382 ha) y las 971 ha de suelo abandonado con riego entran en la bolsa recuperable.", "items": [{"t": "Dotación específica del plátano (m³/ha·año): la memoria del PHT no la da; pedirla al CIATF o al anejo de demandas", "c": "Fuente", "b": 0, "j": 0.5, "x": 0, "o": 2}, {"t": "Consumo de plátano por habitante en Canarias", "c": "Fuente", "b": 0, "j": 0, "x": 0, "o": 1}, {"t": "Decidir si el barbecho (2.382 ha) entra en la bolsa de tierra recuperable", "c": "Decisión", "b": 0, "j": 0.5, "x": 0, "o": 0}], "rf": 2}, {"id": "A3", "short": "A3 Balance", "title": "Balance de suficiencia con ganado, abono y pesca (C3–C5)", "ref": "96_balance_suficiencia_tf.py · 97_balance_salida_tf.json (132 escenarios)", "state": "crit", "stateTxt": "Conclusión que hay que defender", "why": ["Un modelo de programación lineal reparte la tierra. el agua y el forraje para cubrir a la vez energía. proteína. grasa y frutas y hortalizas de 961.745 residentes. Con insumos actuales. el 30 % del suelo abandonado y ganado se llega al <b>16 %</b>.", "Ni el mejor caso cierra la despensa: con rendimientos de España, todo el suelo abandonado y triple pesca, el <b>38 %</b>. En autarquía estricta sin suelo recuperado, el 6 %.", "La grasa es el cuello de botella, como en La Palma, y el modelo la cubre con olivo, girasol, cacahuete y leche de cabra. El caprino está limitado por el monte (13.000 t de materia seca al año, un supuesto calibrado con el máximo del censo ISTAC 2014-2025: 37.253 cabras en 2014, 28.452 en 2025)."], "quiz": ["Si el modelo dice 17 %, ¿qué significa para una familia de cuatro?", "Que la isla produciría, repartida a partes iguales, la comida de uno de los cuatro, y no todos los días del año. El resto llegaría por barco o no llegaría. Es un resultado del modelo, con rendimientos medios y sin pérdidas, no una predicción."], "next": "Validar o cambiar los coeficientes heredados de La Palma (rendimientos, zootecnia, nitrógeno) y rehacer la rejilla.", "items": [{"t": "Validar que los coeficientes de La Palma (rendimientos FAOSTAT, ganado, nitrógeno, pesca) valen para Tenerife", "c": "Decisión", "b": 1, "j": 1, "x": 0, "o": 0}, {"t": "Capacidad real del monte y el matorral para el caprino (hoy 13.000 t MS/año [APROXIMADO])", "c": "Fuente", "b": 1, "j": 0, "x": 0, "o": 2}, {"t": "Primera venta de pesca de 2022 en adelante (solo está publicado 2021)", "c": "Fuente", "b": 0, "j": 0, "x": 0, "o": 1}, {"t": "Decidir si frutas y hortalizas van como cuarta cobertura (como ahora) o como obligación de 400 g/día", "c": "Decisión", "b": 0, "j": 0.5, "x": 0, "o": 0}, {"t": "Composición nutricional contrastada con BEDCA", "c": "Fuente", "b": 0, "j": 0, "x": 0, "o": 2}, {"t": "Rehacer la rejilla de 132 escenarios tras las decisiones", "c": "Técnica", "b": 0, "j": 0, "x": 0, "o": 1}], "rf": 2}, {"id": "A4", "short": "A4 Visor y mapa", "title": "Visor autocontenido con relieve 3D y parcelas", "ref": "05_visor_despensa_cerrada_tf_v3.html · 93c_territorio_tf.py · 90_test_visor.js", "state": "ok", "stateTxt": "Listo para revisar", "why": ["El visor es un único HTML de <b>1.8 MB</b> que funciona sin conexión. con las siete escenas de La Palma. el relieve real de la isla (Copernicus DEM GLO-30) y las 177.543 parcelas del Mapa de Cultivos de Tenerife.", "En el mapa. el modo «despensa cerrada» reparte la tierra liberada sobre parcelas reales: lo más cálido en lo más bajo. y del suelo abandonado se recuperan las 5.764 ha de menor pendiente. Es una ilustración del plan. no una propuesta parcela a parcela.", "Las pruebas con Playwright dan cero conexiones exte   const qs = Q.map((q,k)=>{
    const a = ANS[q.id]||{};
    const opts = q.opciones.map((o,n)=>`<label class="opt"><input type="radio" name="q_${q.id}" id="q_${q.id}_${n}" data-q="${q.id}" value="${n}" ${String(a.sel)===String(n)?'checked':''}> <span>${esc(o)}${q.recomendada===n?' <span class="pill p-ok">recomendada</span>':''}</span></label>`).join('');
    return `<fieldset class="card q"><legend><span class="ref">${k+1} · ${esc(q.asunto)}</span></legend>
      <p style="margin:0 0 6px"><b>${esc(q.pregunta)}</b></p>${q.contexto?`<p class="muted" style="margin:0 0 8px">${esc(q.contexto)}</p>`:''}
      <div class="opts">${opts}<label class="opt"><input type="radio" name="q_${q.id}" id="q_${q.id}_otra" data-q="${q.id}" value="otra" ${a.sel==='otra'?'checked':''}> <span>Otra:</span> <input type="text" class="txt" id="q_${q.id}_otxt" data-otra="${q.id}" value="${esc(a.otra||'')}" placeholder="Escribe tu alternativa"></label></div>
      <input type="text" class="txt nota" id="q_${q.id}_nota" data-nota="${q.id}" value="${esc(a.nota||'')}" placeholder="Nota o matiz (opcional)"></fieldset>`;}).join('');
  return `<section class="slide"><h3>Decisiones abiertas</h3><h2>Responde y copia para continuar</h2>
  <p class="lede">Marca una alternativa o escribe la tuya. Lo que dejes sin contestar sale como <span class="ref">[RESPONDER]</span> para que la siguiente conversación te lo pregunte. Las respuestas también se incorporan al prompt de reinicio.</p>
  <p><button class="btn" id="copyq">Copiar respuestas como prompt</button> <button class="btn" id="recq">Rellenar las vacías con la recomendada</button> <button class="btn" id="clrq">Borrar respuestas</button> <span class="muted" id="qstat" aria-live="polite"></span></p>
  <div class="grid g2">${qs}</div>
  <h3 style="margin-top:18px">Vista previa</h3><pre class="prompt" id="qtxt"></pre></section>`;
}
function refreshQ(){ const t=document.getElementById('qtxt'); if(t) t.textContent=decisionsPrompt(); const st=document.getElementById('qstat'); if(st) st.textContent=`${Q.length-pending()} de ${Q.length} respondidas`; }
function promptSlide(){
  const ideas = R.ideas.map(x=>`<div class="card"><h3>Idea</h3><p style="margin:0 0 6px"><b>${x.titulo}</b></p><p style="margin:0 0 6px">${x.que}</p><p class="muted" style="margin:0">${x.porque}</p>${x.skill?`<p style="margin:8px 0 0"><span class="pill p-ok">${esc(x.skill)}</span>${x.alternativa?` <span class="ref">o ${esc(x.alternativa)}</span>`:''}</p>`:''}</div>`).join('');
  return `<section class="slide"><h3>Reiniciar la conversación</h3><h2>Prompt de reinicio con el contexto de esta instantánea</h2>
  <p class="lede">Ábrelo en una conversación nueva: carga el contexto, las decisiones tomadas y el estado de cada asunto, sin arrastrar el historial largo. Incluye ${R.ideas.length} ideas para aprender a partir de lo generado.</p>
  <div class="grid g3" style="margin-block:14px">${ideas}</div>
  <p><button class="btn" id="copy">Copiar el prompt</button> <span class="muted" id="copied" aria-live="polite"></span></p>
  <pre class="prompt" id="ptxt"></pre></section>`;
}
const slides = [overview, concept, ...P.map(p=>()=>project(p)), questionsSlide, promptSlide];
const names = ["Conjunto","Qué es deuda",...P.map(p=>p.short),"Decisiones","Reinicio"];
let cur = 0;
try{ const s=parseInt(localStorage.getItem('deuda_slide')); if(s>=0&&s<slides.length) cur=s; }catch(e){}
const stage=document.getElementById('stage'), tabs=document.getElementById('tabs');
tabs.innerHTML = names.map((n,i)=>`<button data-go="${i}">${n}</button>`).join('');
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  stage.innerHTML=slides[cur]();
  tabs.querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-current',k===cur));
  document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('pos').textContent=`${cur+1} / ${slides.length}`;
  const pt=document.getElementById('ptxt'); if(pt) pt.textContent=buildPrompt();
  refreshQ();
  try{localStorage.setItem('deuda_slide',cur)}catch(e){}
}
function copyText(txt, preId, statId){
  const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById(preId));const g=getSelection();g.removeAllRanges();g.addRange(r);document.getElementById(statId).textContent='Texto seleccionado: usa Ctrl+C';};
  try{navigator.clipboard.writeText(txt).then(()=>{document.getElementById(statId).textContent='Copiado';},fb)}catch(err){fb()}
}
document.addEventListener('change',e=>{
  const q=e.target.dataset&&e.target.dataset.q; if(q){ANS[q]=Object.assign(ANS[q]||{}, {sel:e.target.value}); saveAns(); refreshQ();}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.otra){ANS[d.otra]=Object.assign(ANS[d.otra]||{}, {otra:e.target.value, sel:'otra'}); const r=document.getElementById('q_'+d.otra+'_otra'); if(r) r.checked=true; saveAns(); refreshQ();}
  if(d.nota){ANS[d.nota]=Object.assign(ANS[d.nota]||{}, {nota:e.target.value}); saveAns(); refreshQ();}
});
document.addEventListener('click',e=>{
  if(e.target.id==='copyq'){ copyText(decisionsPrompt(),'qtxt','qstat'); return; }
  if(e.target.id==='recq'){ Q.forEach(q=>{ const a=ANS[q.id]||{}; if((a.sel===undefined||a.sel===''||a.sel===null) && Number.isInteger(q.recomendada)) ANS[q.id]=Object.assign(a,{sel:String(q.recomendada)}); }); saveAns(); show(cur); return; }
  if(e.target.id==='clrq'){ ANS={}; saveAns(); show(cur); return; }
  const g=e.target.closest('[data-go]'); if(g){show(+g.dataset.go);window.scrollTo(0,0);return;}
  const f=e.target.closest('[data-f]'); if(f){
    const v=f.dataset.f; f.parentElement.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b===f));
    stage.querySelectorAll('tbody tr[data-c]').forEach(r=>r.hidden=!(v==='*'||r.dataset.c===v)); return;}
  if(e.target.id==='copy'){
    const done=()=>document.getElementById('copied').textContent='Copiado';
    const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('ptxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('copied').textContent='Texto seleccionado: usa Ctrl+C';};
    try{navigator.clipboard.writeText(buildPrompt()).then(done,fb)}catch(err){fb()}
  }
});
document.getElementById('prev').onclick=()=>{show(cur-1);window.scrollTo(0,0)};
document.getElementById('next').onclick=()=>{show(cur+1);window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(cur);
</script>
